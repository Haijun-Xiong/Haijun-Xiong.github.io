name: Update Google Scholar stats

on:
  schedule:
    # Every day at 16:01 UTC (00:01 Beijing time).
    - cron: "1 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Fetch Google Scholar statistics
        run: python3 tools/update_scholar.py

      - name: Commit changed statistics
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "No statistics changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "Update Google Scholar stats"
          git push
